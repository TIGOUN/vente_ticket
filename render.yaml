services:
  - type: web
    name: vente-ticket
    runtime: php
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: ./render-build.sh
    startCommand: vendor/bin/heroku-php-apache2 public/
    healthCheckPath: /up
    autoDeploy: true
    disk:
      name: ticket-storage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: TRUSTED_PROXIES
        value: "*"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: vente-ticket-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: vente-ticket-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: vente-ticket-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: vente-ticket-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: vente-ticket-db
          property: password
      - key: MAIL_MAILER
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        sync: false

databases:
  - name: vente-ticket-db
    plan: basic-256mb
    databaseName: vente_ticket
    user: vente_ticket
    region: frankfurt
